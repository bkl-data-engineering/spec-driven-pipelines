name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-java@v4      # pyspark (dev group) needs a JVM for the Spark tests
        with: {distribution: temurin, java-version: "17"}
      - run: uv sync
      - run: uv run python -m unittest discover -s tests -t . -v
      - name: Generated code must match the specs
        run: for s in specs/*.yaml; do uv run python -m generator.cli generate "$s" --check; done
