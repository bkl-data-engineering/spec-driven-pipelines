name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -m unittest discover -s tests -t .
      - name: Generated code must match the specs
        run: for s in specs/*.yaml; do uv run python -m generator.cli generate "$s" --check; done
