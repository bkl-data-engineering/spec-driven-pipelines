# Databricks Asset Bundle root. Job definitions are generated into generated/*/job.yml.
# Tasks have no cluster block, so they run on serverless compute (what Free Edition offers).
bundle:
  name: spec-driven-pipelines

include:
  - generated/*/job.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://CHANGE-ME.cloud.databricks.com   # your Free Edition workspace URL (browser address bar, up to .com)

sync:
  exclude:            # keep the deployed bundle small: only code + specs go to the workspace
    - sample_data/**
    - tests/**
