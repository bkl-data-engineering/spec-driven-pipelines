[project]
name = "spec-driven-pipelines"
version = "0.1.0"
description = "Generate bronze/silver pipelines from YAML specs"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml", "jinja2"]

[dependency-groups]
dev = ["pyspark>=3.5"]   # optional: only for tests/test_silver_spark.py (needs Java)

[tool.uv]
package = false
